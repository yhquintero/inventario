name: CI NovaGest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nocturno UTC: incluye la prueba de restauración

jobs:
  web-y-servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Panel de Control Visual (sintaxis y funciones del panel)
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File tools/test_panel_control.ps1
          else
            echo "pwsh no está disponible en este runner: se omite la comprobación del panel."
          fi
        # Comprobación rápida e independiente (no necesita Node ni Python): el
        # panel es Windows Forms, pero tools/test_panel_control.ps1 solo usa el
        # analizador de PowerShell y las funciones puras (sin interfaz), así que
        # corre igual en Linux. Valida la sintaxis de iniciar-https.ps1 y
        # panel-control.ps1, el BOM UTF-8 de los .ps1 con acentos y las
        # funciones del panel.
      # tools/ci_paso.sh ejecuta cada prueba y, si falla, publica el final de su
      # salida como anotación (::error::): la causa se ve en el resumen del CI.
      - name: Pruebas Web e IPV
        run: |
          set -e
          bash tools/ci_paso.sh node tools/test_ipv.mjs
          bash tools/ci_paso.sh node tools/test_calc.mjs
          bash tools/ci_paso.sh node tools/test_charts.mjs
          bash tools/ci_paso.sh node tools/cobertura.mjs --min 80
          bash tools/ci_paso.sh node tools/test_accesibilidad.mjs
          bash tools/ci_paso.sh node tools/test_sw_precache.mjs
          bash tools/ci_paso.sh npm --prefix tools install --ignore-scripts
          bash tools/ci_paso.sh node tools/test_axe.mjs
          bash tools/ci_paso.sh node tools/test_generador_ui.mjs
          bash tools/ci_paso.sh node tools/test_almacenes.mjs
          bash tools/ci_paso.sh node tools/test_customers_credits.mjs
          bash tools/ci_paso.sh node tools/test_excel_sources.mjs
          bash tools/ci_paso.sh node tools/smoke_web.mjs
      - name: Pruebas Python y sintaxis del servidor
        run: |
          set -e
          bash tools/ci_paso.sh python3 -m py_compile server/novagest_server.py tools/license_studio.py
          bash tools/ci_paso.sh python3 -m pip install -r requirements.txt
          bash tools/ci_paso.sh python3 tools/test_licencia.py
          bash tools/ci_paso.sh python3 tools/test_generador.py
          bash tools/ci_paso.sh python3 tools/test_seguridad_servidor.py
          bash tools/ci_paso.sh python3 tools/test_restauracion.py
          bash tools/ci_paso.sh python3 tools/test_carga.py --n 12
      - name: Inventario de pendientes no inventados (informativo)
        run: python3 tools/verificar_pendientes.py
        # No bloquea: lista [COMPLETAR], firmas y casillas que solo puede
        # cerrar el titular/asesor/firma externa. Revisar la salida en cada PR.
      - name: Auditoría de dependencias Python (SCA)
        run: |
          python3 -m pip install pip-audit
          python3 -m pip_audit -r requirements.txt --desc || true
        # «|| true»: el informe no bloquea el CI; revísese cada aviso y, cuando
        # no queden avisos sin tratar, quite el «|| true» para que bloquee.

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        # La versión de Gradle la fija el wrapper del repositorio (gradlew), así que
        # local y CI compilan con la misma. Ya no se instala una versión aparte.
      - name: Pruebas unitarias Android y compilación del keygen
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest :keygen:assembleDebug --stacktrace 2>&1 | tee gradle.log; then
            # Publica la causa como anotaciones (visibles en el resumen del CI sin
            # abrir los registros): errores de Kotlin/Java, pruebas fallidas y el
            # bloque «What went wrong» de Gradle.
            resumen="$({
              grep -E '^e: |error:|FAILED' gradle.log | head -40
              grep -A 45 'What went wrong' gradle.log | grep -v '^\s*at ' | head -60
            } | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            echo "::error::Gradle falló:%0A${resumen}"
            exit 1
          fi
