# H12 (auditoría 2026): Dependabot vigila dependencias vulnerables en GitHub.
version: 2
updates:
  - package-ecosystem: "pip"          # requirements.txt del servidor
    directory: "/"
    schedule:
      frequency: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gradle"       # app Android
    directory: "/"
    schedule:
      frequency: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      frequency: "monthly"
    open-pull-requests-limit: 3
